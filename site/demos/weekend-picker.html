<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What should we do this weekend?</title><style>@font-face{font-family:Code;src:url('../fonts/source-code-pro-regular.woff2')}*{box-sizing:border-box}body{margin:0;padding:22px;background:#14232b;color:#faf9f5;font:18px/1.4 Code,monospace}h1{font-size:28px;color:#e7a58d;margin:0 0 14px}label{display:inline-block;margin:0 10px 12px 0}select,button{font:inherit;padding:8px;background:#263e48;color:#fff;border:1px solid #e7a58d}select{display:block;margin-top:5px}button{cursor:pointer}h2{font-size:23px;margin-bottom:6px}p{margin:8px 0}small{font-size:12px}.idea{border-top:1px solid #7a6a60;padding:12px 0}.save{font-size:15px;margin-top:8px}#status{color:#e7a58d}</style><h1>What should we do this weekend?</h1><label>In the mood for<select id="interest"><option value="">Anything</option><option>Outdoors</option><option>Creative</option><option>Food</option></select></label><label>Budget per person<select id="budget"><option value="0">Free</option><option value="15" selected>Up to $15</option><option value="30">Up to $30</option></select></label><label>Time available<select id="hours"><option value="1">1 hour</option><option value="2" selected>2 hours</option><option value="4">4 hours</option></select></label><button id="go">Find an idea</button><p id="status" role="status"></p><main id="ideas"></main><small>Working local example. Generic activities, illustrative budgets and durations—not live venue listings. Saved ideas stay in this browser.</small><script>
const activities=[{id:'walk',name:'Photo scavenger walk',interest:'Outdoors',cost:0,hours:1,description:'Pick five colors. Walk your neighborhood and photograph something in each.'},{id:'picnic',name:'Bring-your-own picnic',interest:'Outdoors',cost:15,hours:2,description:'Choose a nearby park and pack a snack. Check opening hours and weather.'},{id:'sketch',name:'One-hour sketch swap',interest:'Creative',cost:0,hours:1,description:'Draw an everyday object, swap with a friend, and invent a story about it.'},{id:'craft',name:'Make something from the recycling',interest:'Creative',cost:0,hours:2,description:'Build a tiny sculpture from clean materials you already have.'},{id:'snack',name:'Blind snack tasting',interest:'Food',cost:15,hours:1,description:'Each person brings a snack. Hide the labels and compare your guesses.'},{id:'cook',name:'Pantry cooking challenge',interest:'Food',cost:0,hours:2,description:'Use ingredients you already own. Pick a theme and make lunch together.'}];let saved=[];try{const value=JSON.parse(localStorage.getItem('vibe-weekend-saved'));if(Array.isArray(value))saved=value.filter(x=>typeof x==='string');}catch{}const $=id=>document.getElementById(id);function render(){const matches=activities.filter(a=>(!$('interest').value||a.interest===$('interest').value)&&a.cost<=Number($('budget').value)&&a.hours<=Number($('hours').value));$('ideas').replaceChildren();$('status').textContent=matches.length?`${matches.length} ideas · ${saved.length} saved`:'No matches. Try another interest, budget, or time.';for(const a of matches){const section=document.createElement('section');section.className='idea';const h=document.createElement('h2');h.textContent=a.name;const p=document.createElement('p');p.textContent=`${a.interest} · ${a.hours} hour${a.hours===1?'':'s'} · ${a.cost?'about $'+a.cost:'free'}`;const description=document.createElement('p');description.textContent=a.description;const button=document.createElement('button');button.className='save';button.textContent=saved.includes(a.id)?'Saved ✓':'Save this idea';button.onclick=()=>{saved=saved.includes(a.id)?saved.filter(x=>x!==a.id):[...saved,a.id];let stored=true;try{localStorage.setItem('vibe-weekend-saved',JSON.stringify(saved));}catch{stored=false;}render();if(!stored)$('status').textContent='Browser storage unavailable. Saved for this visit only.';};section.append(h,p,description,button);$('ideas').append(section);}}$('go').onclick=render;for(const id of ['interest','budget','hours'])$(id).onchange=render;render();
</script></html>
