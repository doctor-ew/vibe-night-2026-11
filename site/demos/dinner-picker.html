<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What’s for dinner?</title><style>@font-face{font-family:Code;src:url('../fonts/source-code-pro-regular.woff2')}body{margin:0;padding:24px;background:#14232b;color:#faf9f5;font:21px/1.4 Code,monospace}h1{font-size:30px;color:#e7a58d;margin:0 0 12px}select,button{font:inherit;padding:10px;background:#263e48;color:#fff;border:1px solid #e7a58d;margin:8px 8px 8px 0}button{cursor:pointer}#meal{font-size:28px;margin-bottom:8px}#ingredients{font-size:20px}small{font-size:13px}</style><h1>What’s for dinner?</h1><p>One small app. One less daily decision.</p><label>How much time? <select id="time"><option value="10">10 minutes</option><option value="20" selected>20 minutes</option><option value="30">30 minutes</option></select></label><button id="pick">Pick my dinner</button><h2 id="meal" aria-live="polite">Tomato pasta</h2><p id="ingredients">Pasta + tomatoes + your usual seasonings.</p><small>Local example built for Vibe Night, not a Muse screenshot or export. Meal ideas and times are illustrative; change them to suit your kitchen.</small><script>const meals=[{name:'Tomato pasta',time:20,ingredients:'Pasta + tomatoes + your usual seasonings.'},{name:'Eggs on toast',time:10,ingredients:'Eggs + bread + whatever greens you have.'},{name:'Rice bowl',time:30,ingredients:'Rice + vegetables + your favorite sauce.'},{name:'Tomato toast',time:10,ingredients:'Bread + tomatoes + your usual seasonings.'},{name:'Vegetable omelet',time:20,ingredients:'Eggs + chopped vegetables + your favorite filling.'}];let previous='Tomato pasta';const time=document.getElementById('time'),pick=document.getElementById('pick');function choose(){const options=meals.filter(m=>m.time<=Number(time.value)&&m.name!==previous);const meal=options[Math.floor(Math.random()*options.length)];previous=meal.name;document.getElementById('meal').textContent=meal.name;document.getElementById('ingredients').textContent=meal.ingredients;pick.textContent='Pick something else';}pick.onclick=choose;time.onchange=choose;</script></html>
