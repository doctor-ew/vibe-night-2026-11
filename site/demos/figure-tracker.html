<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toy Chest — Collection tracker</title>
<style>
@font-face{font-family:Code;src:url('../fonts/source-code-pro-regular.woff2')}*{box-sizing:border-box}body{margin:0;background:#111820;color:#faf9f5;font:16px Code,monospace;padding:22px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #e7a58d;padding-bottom:12px}h1{font-size:28px;margin:0;color:#e7a58d}p{line-height:1.4}small{color:#c4cacb}button,input,select{font:inherit;border:1px solid #7b8c93;border-radius:0;padding:9px;background:#1b2c37;color:#fff}button{cursor:pointer}button:hover,button:focus{border-color:#e7a58d;color:#e7a58d}input,select{min-width:0}.toolbar{display:flex;gap:8px;margin:14px 0}.toolbar input{flex:1;width:100px}.stats{color:#e7a58d}.catalog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.figure{text-align:left;min-height:104px;border-top:3px solid #e7a58d}.figure strong{display:block;font-size:18px;line-height:1.3;margin-bottom:10px}.figure span{font-size:13px}dialog{color:#fff;background:#14212b;border:2px solid #e7a58d;width:min(90vw,620px);max-height:90vh;padding:22px}dialog::backdrop{background:#000b}dialog img{width:100%;max-height:200px;object-fit:contain}label{display:grid;gap:5px;margin:10px 0}form button{margin:10px 8px 0 0}#status{min-height:1.5em;color:#e7a58d}.note{font-size:12px;margin-top:16px}#empty{padding:20px} @media(max-width:650px){body{padding:16px}.catalog{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{flex-wrap:wrap}h1{font-size:24px}.toolbar button{font-size:14px}.figure strong{font-size:16px}}
</style>
<header><div><h1>THE TOY CHEST</h1><small>COLLECTION / PLAYER ONE</small></div><div class="stats" id="stats"></div></header>
<p>Find a figure. Check its details. Add your next treasure.</p>
<div class="toolbar"><input id="query" aria-label="Search figures" placeholder="Search figures"><select id="franchise" aria-label="Filter franchise"><option value="">All franchises</option></select><button id="add">+ Add</button><button id="export">Export</button></div>
<main class="catalog" id="catalog"></main><div id="empty" hidden>No figures match. Try another search.</div><p role="status" id="status"></p>
<div class="note">Working local demo made for Vibe Night. Sample records and values; not a Stitch product screenshot or appraisal. Data stays in this browser. <button id="reset">Reset sample</button></div>
<dialog id="detail"><button id="closeDetail">Close</button><h2 id="detailName"></h2><img id="detailPhoto" src="../media/action-figure-lineup.png" alt="Drew’s collection, shown as the sample collection photo"><p id="detailText"></p></dialog>
<dialog id="editor"><h2>Add a figure</h2><form id="form"><label>Photo (optional, stays local; up to 2 MB)<input name="photo" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><label>Name<input name="name" required maxlength="80"></label><label>Franchise<input name="franchise" maxlength="60"></label><label>Condition<select name="condition"><option>Good</option><option>Played with</option><option>Boxed</option><option>Unknown</option></select></label><label>Estimated value ($)<input name="value" type="number" required min="0" step="0.01" value="0"></label><label><span><input name="packaging" type="checkbox"> Original packaging</span></label><button type="submit">Save figure</button><button id="cancel" type="button">Cancel</button><p id="error" role="alert"></p></form></dialog>
<script type="module">
import { seed, selectFigures, addFigure, totalValue } from './collector-model.mjs';
const $ = id => document.getElementById(id);
let figures=structuredClone(seed);
try { const saved=JSON.parse(localStorage.getItem('vibe-toy-chest')); if(Array.isArray(saved)&&saved.every(f=>typeof f.name==='string'&&typeof f.franchise==='string'&&typeof f.condition==='string'&&typeof f.value==='number'&&Number.isFinite(f.value)&&f.value>=0))figures=saved; } catch {}
function persist(){try{localStorage.setItem('vibe-toy-chest',JSON.stringify(figures));$('status').textContent='Saved in this browser.';}catch{$('status').textContent='Browser storage unavailable; use Export to keep your changes.';}}
function render(){
 const selected=$('franchise').value;const all=new Option('All franchises','');$('franchise').replaceChildren(all,...[...new Set(figures.map(f=>f.franchise))].sort().map(x=>new Option(x,x)));$('franchise').value=selected;
 const shown=selectFigures(figures,$('query').value,$('franchise').value);$('stats').textContent=`${figures.length} figures · $${totalValue(figures).toFixed(0)}`;$('catalog').replaceChildren();$('empty').hidden=shown.length>0;
 for(const f of shown){const b=document.createElement('button');b.className='figure';const name=document.createElement('strong');name.textContent=f.name;const line=document.createElement('span');line.textContent=`${f.franchise} / $${f.value}`;b.append(name,line);b.onclick=()=>{$('detailName').textContent=f.name;$('detailPhoto').src=f.photo||'../media/action-figure-lineup.png';$('detailPhoto').alt=f.photo?f.name:'Drew’s sample collection photo';$('detailText').textContent=`${f.franchise} · ${f.condition} · Estimated $${f.value} · Original packaging: ${f.packaging?'yes':'no'}`;$('detail').showModal();};$('catalog').append(b);}
}
$('query').oninput=render;$('franchise').onchange=render;$('closeDetail').onclick=()=>$('detail').close();$('add').onclick=()=>{$('error').textContent='';$('editor').showModal();};$('cancel').onclick=()=>$('editor').close();
$('form').onsubmit=async e=>{e.preventDefault();const d=new FormData(e.target);try{let photo='';const file=d.get('photo');if(file&&file.size){if(file.size>2*1024*1024)throw new Error('Choose a photo smaller than 2 MB.');photo=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Could not read photo.'));reader.readAsDataURL(file);});}figures=addFigure(figures,{...Object.fromEntries(d),photo,packaging:d.has('packaging')},crypto.randomUUID());persist();e.target.reset();$('editor').close();$('query').value='';$('franchise').value='';render();}catch(error){$('error').textContent=error.message;}};
$('reset').onclick=()=>{figures=structuredClone(seed);$('query').value='';$('franchise').value='';persist();render();};
$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(figures,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='my-toy-chest.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='Collection exported as JSON.';};render();
</script></html>
