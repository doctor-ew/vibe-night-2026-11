<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toy Chest Match — Vibe Night</title><style>@font-face{font-family:Code;src:url('../fonts/source-code-pro-regular.woff2')}*{box-sizing:border-box}body{margin:0;background:#101c29;color:#faf9f5;font:14px/1.3 Code,monospace;padding:14px;max-width:800px;margin:auto}h1{font-size:24px;margin:0;color:#e7a58d}header{display:flex;gap:10px;align-items:center;justify-content:space-between}select,button{font:inherit;color:#faf9f5;background:#20364a;border:1px solid #829baf;padding:7px;cursor:pointer}select{max-width:130px}.controls{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.score{margin:9px 0;color:#e7a58d}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.card{height:53px;font-size:29px;line-height:1;border:2px solid #688fa8;background:#243950}.card:focus-visible{outline:3px solid #f5d565;outline-offset:2px}.card:disabled{cursor:default;opacity:1}.card.matched{background:#244938;border-color:#96d4ae}.card.hidden{font:24px Code,monospace;color:#e7a58d}.note{font-size:11px;margin:10px 0 0;color:#b8c9d6}a{color:#e7a58d}#status{font-size:13px;margin:8px 0;min-height:1.3em}@media(max-width:430px){.board{grid-template-columns:repeat(3,1fr)}.card{height:52px}h1{font-size:21px}}</style></head><body><header><h1>TOY CHEST MATCH</h1><button id="restart" type="button">Play again</button></header><div class="controls"><label>Theme <select id="theme"><option value="space">Space toys</option><option value="dino">Dinosaurs</option></select></label><label>Pairs <select id="pairs"><option value="6">6 pairs</option><option value="3">3 · easy</option></select></label></div><p class="score" id="score"></p><div id="board" class="board" aria-label="Memory matching cards"></div><p id="status" role="status" aria-live="polite">Find the matching pairs.</p><p class="note">Prepared playable Vibe Night example · not a Stitch export. <a href="../prompts.html#design" target="_blank" rel="noopener noreferrer">Design your version →</a></p><script>
const themes={space:[['🚀','Rocket'],['🤖','Robot'],['👾','Alien'],['🪐','Planet'],['🕹️','Joystick'],['⚡','Lightning']],dino:[['🦖','Tyrannosaurus'],['🦕','Long-neck dinosaur'],['🥚','Egg'],['🌋','Volcano'],['🌿','Fern'],['☄️','Comet']]};
const board=document.getElementById('board'),score=document.getElementById('score'),status=document.getElementById('status');let cards=[],open=[],matches=new Set(),attempts=0,locked=false,pending;
function start(){clearTimeout(pending);const count=Number(document.getElementById('pairs').value),choices=themes[document.getElementById('theme').value].slice(0,count);cards=[...choices,...choices].map(([symbol,name],id)=>({symbol,name,id}));for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}open=[];matches=new Set();attempts=0;locked=false;status.textContent='Find the matching pairs.';render();}
function render(){board.replaceChildren();score.textContent=`${matches.size/2}/${cards.length/2} pairs · ${attempts} attempts`;cards.forEach((card,index)=>{const shown=open.includes(index)||matches.has(index),button=document.createElement('button');button.type='button';button.className='card'+(matches.has(index)?' matched':shown?'':' hidden');button.textContent=shown?card.symbol:'?';button.setAttribute('aria-label',shown?card.name:`Hidden card ${index+1}`);button.disabled=shown;button.onclick=()=>flip(index);board.append(button);});}
function flip(index){if(locked||open.includes(index)||matches.has(index))return;open.push(index);if(open.length===2){attempts++;const[a,b]=open;if(cards[a].name===cards[b].name){matches.add(a);matches.add(b);open=[];status.textContent=matches.size===cards.length?`You found every pair in ${attempts} attempts! Play again or change the theme.`:'A match! Find another pair.';}else{locked=true;status.textContent='Different toys — remember where they are.';pending=setTimeout(()=>{open=[];locked=false;status.textContent='Try another pair.';render();},800);}}render();}
document.getElementById('restart').onclick=start;document.getElementById('theme').onchange=start;document.getElementById('pairs').onchange=start;start();
</script></body></html>
